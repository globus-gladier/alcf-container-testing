name: Build Apptainer image

on:
  push:
    branches: [main]
    paths:
      - polaris-apptainer-example.def
      - .github/workflows/build-sif.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Build SIF
        run: apptainer build polaris-apptainer-example.sif polaris-apptainer-example.def

      - name: Smoke test
        run: |
          apptainer exec polaris-apptainer-example.sif cat /opt/container-marker.txt
          apptainer exec polaris-apptainer-example.sif \
            python3 -c "import globus_compute_sdk, globus_compute_endpoint, globus_sdk"

      - name: Push to GHCR
        run: |
          # GHCR requires lowercase image names
          image="ghcr.io/${GITHUB_REPOSITORY,,}/polaris-apptainer-example"
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push polaris-apptainer-example.sif "oras://${image}:latest"
          apptainer push polaris-apptainer-example.sif "oras://${image}:${GITHUB_SHA::7}"
